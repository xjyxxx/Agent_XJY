name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Windows runner 的 stdout 默认是 cp1252，打印中文会 UnicodeEncodeError。
# 统一开 UTF-8，比在每个脚本里 try/except 编码更可靠。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: agent_studio_demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent_studio_demo/requirements*.txt

      # 只装 CI 需要的：HTTP 层 + 官方 LangGraph。granian 各平台轮子不全，
      # 故意不装——它的作用只是"更快的 server"，测试会自动退回 stdlib。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn langgraph langgraph-checkpoint-sqlite
          python -m pip install -r requirements-dev.txt

      - name: 环境自检
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import fastapi, uvicorn, langgraph; print('deps ok')"

      - name: 静态检查（ruff：未定义名 / 未用 import / 语法错误）
        run: python -m ruff check .

      - name: 构建检查（Python/配置/前端/样例/编译/导入冒烟）
        run: python manage.py build

      - name: 单元测试
        run: python -m pytest -q --junitxml=test-report.xml

      # 日志下载接口要仓库权限，注解是公开可读的——失败时把原因写进注解。
      - name: 失败转注解
        if: failure()
        run: python tools/ci_report.py --from-junit test-report.xml

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_studio_demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent_studio_demo/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn langgraph langgraph-checkpoint-sqlite
          python -m pip install -r requirements-dev.txt

      - name: 跑覆盖率
        run: |
          coverage run --source=. --omit="tests/*,third_party/*,docs/*" -m pytest -q
          coverage report -m --fail-under=70
          coverage xml -o coverage.xml

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: agent_studio_demo/coverage.xml
          if-no-files-found: warn
