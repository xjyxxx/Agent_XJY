name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: agent_studio_demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent_studio_demo/requirements*.txt

      # 只装 CI 需要的：HTTP 层 + 官方 LangGraph。granian 各平台轮子不全，
      # 故意不装——它的作用只是"更快的 server"，测试会自动退回 stdlib。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn langgraph langgraph-checkpoint-sqlite

      - name: 环境自检
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import fastapi, uvicorn, langgraph; print('deps ok')"

      - name: 构建检查（Python/配置/前端/样例/编译/导入冒烟）
        run: python manage.py build

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_studio_demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent_studio_demo/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn langgraph langgraph-checkpoint-sqlite coverage

      - name: 跑覆盖率
        run: |
          coverage run --source=. --omit="tests/*,third_party/*,docs/*" -m unittest discover -s tests -t . -p "test_*.py"
          coverage report -m --fail-under=70
          coverage xml -o coverage.xml

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: agent_studio_demo/coverage.xml
          if-no-files-found: warn
